[project]
name = "medvisit-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agentscope>=2.0,<3",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "pypdf>=6.21.2,<7",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
