name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run build:android

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.13
      - run: uv sync --directory backend --locked
      - run: uv run --directory backend --locked pytest -q --junitxml=data/validation/ci.xml
      - name: Require PostgreSQL tests to run
        run: |
          python - <<'PY'
          from xml.etree import ElementTree
          report = ElementTree.parse('backend/data/validation/ci.xml')
          assert sum(int(s.attrib.get('skipped', 0)) for s in report.iter('testsuite')) == 0
          PY

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure Android toolchain
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_25_X64:?JDK 25 is required}"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME" >> "$GITHUB_PATH"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          printf 'NDK_HOME=%s/ndk/28.2.13676358\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" aarch64-linux-android
      - run: npm --prefix frontend ci
      - name: Compile installable ARM64 APK
        run: npm run android:build -- --debug --apk --target aarch64 --ci -- --locked
      - name: Check packaged user resources and locked dependencies
        run: |
          python - <<'PYCODE'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          apks = list(Path('frontend/src-tauri/gen/android/app/build/outputs/apk').glob('**/debug/*.apk'))
          assert len(apks) == 1, 'Expected one ARM64 debug APK'
          with ZipFile(apks[0]) as archive:
              names = archive.namelist()
              assert any(name.startswith('lib/arm64-v8a/') and name.endswith('.so') for name in names)
              assert b'/_android/assets/' in archive.read('assets/index.html')
              assert any(name.startswith('assets/assets/') and name.endswith('.js') for name in names)
              assert not any(PurePosixPath(name).name in ('.env', 'keystore.properties', 'local.properties')
                             or PurePosixPath(name).suffix in ('.jks', '.keystore') for name in names)
          print('ARM64 APK contains the bundled Android user resources and no signing-key files')
          PYCODE
          git diff --exit-code -- frontend/package-lock.json frontend/src-tauri/Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BreathOn-android-arm64-debug-${{ github.sha }}
          path: frontend/src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

  deployment:
    needs: [frontend, backend, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: medvisit-ci
      POSTGRES_PASSWORD: ci-only-password
      BACKEND_ENV_FILE: /dev/null
      WEB_PORT: '18080'
      ALLOWED_ORIGINS: http://127.0.0.1:18080
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - run: python deploy/check-stack.py
      - name: Check nonroot archive persistence across container replacement
        run: |
          docker compose exec -T api python -c 'import os; from pathlib import Path; assert os.getuid() == 10001; Path("/app/data/sessions/ci-marker").write_text("persistent")'
          docker compose up -d --force-recreate --no-deps --wait --wait-timeout 90 api
          docker compose exec -T api python -c 'from pathlib import Path; assert Path("/app/data/sessions/ci-marker").read_text() == "persistent"'
          python deploy/check-stack.py
      - name: Check database outage and recovery
        run: |
          docker compose stop db
          python - <<'PY'
          from urllib.request import urlopen
          from urllib.error import HTTPError
          origin = 'http://127.0.0.1:18080'
          with urlopen(origin+'/api/live', timeout=5) as response:
              assert response.status == 200
          for path in ('/api/ready', '/api/sessions'):
              try:
                  urlopen(origin+path, timeout=8)
              except HTTPError as error:
                  assert error.code == 503
                  error.close()
              else:
                  raise AssertionError('Database outage must return 503: '+path)
          PY
          docker compose up -d --no-deps --no-recreate --wait --wait-timeout 60 db
          python deploy/check-stack.py
      - name: Check authenticated account isolation
        run: |
          set -euo pipefail
          umask 077
          smoke_dir=$(mktemp -d "$RUNNER_TEMP/medvisit-auth-smoke.XXXXXX")
          trap 'rm -rf "$smoke_dir"' EXIT
          docker compose exec -T api python - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          import secrets
          from medvisit.api.auth import hash_password
          os.umask(0o077)
          root = Path('/tmp/medvisit-auth-smoke')
          root.mkdir(mode=0o700, exist_ok=True)
          users = {'admin':'ci-auth-admin', 'representative_a':'ci-auth-a', 'representative_b':'ci-auth-b'}
          credentials = {role:{'username':name, 'password':secrets.token_urlsafe(32)} for role,name in users.items()}
          hashes = {item['username']:hash_password(item['password']) for item in credentials.values()}
          (root/'credentials.json').write_text(json.dumps(credentials))
          (root/'backend.env').write_text("LOGIN_USERS_JSON='"+json.dumps(hashes)+"'\nADMIN_USERS_JSON='"+json.dumps([users['admin']])+"'\n")
          PYCODE
          docker compose cp api:/tmp/medvisit-auth-smoke/credentials.json "$smoke_dir/credentials.json"
          docker compose cp api:/tmp/medvisit-auth-smoke/backend.env "$smoke_dir/backend.env"
          chmod 600 "$smoke_dir/credentials.json" "$smoke_dir/backend.env"
          BACKEND_ENV_FILE="$smoke_dir/backend.env" AUTH_REQUIRED=true \
            docker compose up -d --force-recreate --no-deps --wait --wait-timeout 90 api
          DISPOSABLE_AUTH_SMOKE=1 AUTH_SMOKE_CREDENTIALS_FILE="$smoke_dir/credentials.json" \
            python deploy/check-auth.py
      - name: Deployment logs
        if: failure()
        run: docker compose logs --tail 100
      - name: Remove disposable stack
        if: always()
        run: docker compose down --volumes

  production:
    needs: [frontend, backend, android, deployment]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: medvisit-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check latest main revision
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          [[ "$latest_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            printf 'deploy=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'deploy=false\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'Skipping production deploy: a newer main revision exists.'
          fi
      - name: Deploy production after all checks
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          transport="$RUNNER_TEMP/medvisit-transport"
          payload="$RUNNER_TEMP/medvisit-payload"
          mkdir -p "$transport" "$payload"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$transport/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$transport/known_hosts"
          printf '%s\n' "$GITHUB_SHA" > "$payload/REVISION"
          # The restricted receiver auto-detects gzip; retain its source.tar filename.
          git archive --format=tar.gz HEAD -- . ':(exclude)frontend/src-tauri' ':(exclude)frontend/src/assets/library' > "$payload/source.tar"
          python - "$payload/source.tar" <<'PYCODE'
          import sys
          import tarfile
          with tarfile.open(sys.argv[1]) as archive:
              names = set(archive.getnames())
          required = {'LICENSE', 'compose.yaml', 'deploy/server-deploy.sh', 'deploy/backup.py',
                      'deploy/frontend.Dockerfile', 'deploy/backend.Dockerfile',
                      'frontend/src/admin-app.tsx', 'backend/medvisit/api/app.py'}
          assert required <= names, 'Incomplete server source archive'
          assert not any(name.startswith(('frontend/src-tauri/', 'frontend/src/assets/library/')) for name in names)
          PYCODE
          tar -cf - -C "$payload" REVISION source.tar | \
            ssh -i "$transport/key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$transport/known_hosts" -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 "$DEPLOY_USER@$DEPLOY_HOST"
