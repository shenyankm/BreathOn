map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

log_format bounded '$remote_addr $request_method $uri $status $body_bytes_sent $request_time request_id=$upstream_http_x_request_id';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log bounded;
    client_max_body_size 20m;
    # Docker may assign a new address when only the API container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/api/visits/[^/]+/audio$ {
        client_max_body_size 100m;
        set $api_backend http://api:8000;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }

    location /api/ {
        set $api_backend http://api:8000;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_buffering off;
    }

    # User screens are bundled in the APK; the web server serves management only.
    location = /app { return 410; }
    location ^~ /app/ { return 410; }
    location = /preview-visit.html { return 410; }
    location ^~ /_android/ { return 404; }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
